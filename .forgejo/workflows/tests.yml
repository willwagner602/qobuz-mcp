# Forgejo Actions: native CI for qobuz-mcp.
#
# The test suite is offline by design (fixture transports, no network, no
# credentials): CI deliberately receives no QOBUZ_* environment at all, and
# the stdio harness strips any it finds. No runner secrets are required.
#
# Image note: python:3.14-slim has no Node, and actions/checkout is a
# JavaScript action, so nodejs + git are installed before checkout runs
# (forgejo-runner v13 fetches the action via data.forgejo.org and executes
# it inside the job container).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: offline test suite
    runs-on: docker
    container:
      image: python:3.14-slim
    steps:
      - name: Install node + git (checkout is a JS action)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs git >/dev/null

      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install package + pytest
        run: python -m pip install --quiet --disable-pip-version-check -e '.[dev]'

      - name: Run offline test suite
        run: pytest -q
