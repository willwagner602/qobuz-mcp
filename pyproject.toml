[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qobuz-mcp"
version = "0.1.0"
description = "Personal-use Qobuz playlist MCP (unofficial; offline scaffold, write tools gated pending endpoint validation)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qobuz-mcp = "qobuz_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
